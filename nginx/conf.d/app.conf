# HTTP — тільки для ACME challenge і редіректу на HTTPS
server {
    listen 80;
    server_name aleksylya.pp.ua;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все інше → редірект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основний сервер (підключається після отримання сертифіката)
server {
    listen 443 ssl;
    server_name aleksylya.pp.ua;

    ssl_certificate     /etc/letsencrypt/live/aleksylya.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aleksylya.pp.ua/privkey.pem;

    # Рекомендовані параметри від certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Webhook Telegram → бот
    location /webhook {
        proxy_pass         http://bot:8080/webhook;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
